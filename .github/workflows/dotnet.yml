name: .NET CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'
    
    - name: Restore dependencies
      run: dotnet restore BakhmatovCalculator.sln
      
    - name: Build
      run: dotnet build BakhmatovCalculator.sln -c Release --no-restore
      
    - name: Test
      run: dotnet test BakhmatovCalculator.sln -c Release --no-build --verbosity normal
